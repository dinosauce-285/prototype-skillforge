<!doctype html>

<html class="light" lang="en">
  <head>
    <link rel="stylesheet" href="../../shared/tailwind-desktop.css" />
    <link rel="stylesheet" href="../../shared/base.css" />

    <meta charset="utf-8" />
    <meta
      name="description"
      content="SkillForge — The premium platform for professional skill development and certification."
    />
    <link rel="icon" type="image/svg+xml" href="../../shared/favicon.svg" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SkillForge | Admin Login</title>
  </head>
  <body
    class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden"
  >
    <!-- Dynamic Background Elements for "SkillForge" feel -->
    <div
      class="absolute -top-24 -left-24 w-96 h-96 bg-primary/10 rounded-full blur-[100px]"
    ></div>
    <div
      class="absolute -bottom-24 -right-24 w-96 h-96 bg-tertiary/10 rounded-full blur-[100px]"
    ></div>
    <!-- Login Card Container -->
    <main class="w-full max-w-md z-10">
      <!-- Brand Header (Asymmetric Layout) -->
      <div class="mb-12 text-left pl-2">
        <div class="flex items-center gap-3 mb-4">
          <div
            class="w-12 h-12 sf-gradient rounded-xl flex items-center justify-center shadow-lg shadow-primary/20"
          >
            <span
              class="material-symbols-outlined icon text-white icon-lg icon-filled"
              >school</span
            >
          </div>
          <h1 class="text-4xl font-extrabold tracking-tight text-on-surface">
            SkillForge
          </h1>
        </div>
        <p
          class="text-on-surface-variant font-medium text-lg leading-relaxed max-w-[280px]"
        >
          Access the professional
          <span class="text-primary font-bold">Admin Portal</span> for content
          curation.
        </p>
      </div>
      <!-- Login Form Card -->
      <div class="card">
        <div class="mb-8">
          <h2 class="text-xl font-bold text-on-surface mb-2">
            Secure Authentication
          </h2>
          <div class="h-1 w-12 bg-primary rounded-full"></div>
        </div>
        <form class="stack">
          <!-- Email Field -->
          <div class="stack-xs">
            <label
              class="text-sm font-bold text-on-surface-variant uppercase tracking-wider pl-1"
              for="email"
              >Administrator Email</label
            >
            <div class="relative group">
              <div
                class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"
              >
                <span
                  class="material-symbols-outlined icon text-outline group-focus-within:text-primary transition-colors"
                  >alternate_email</span
                >
              </div>
              <input
                class="w-full bg-surface-container-low border-transparent focus:border-primary focus:ring-0 rounded-xl py-4 pl-12 pr-4 text-on-surface font-medium transition-all duration-200 placeholder:text-outline/50 border-2"
                id="email"
                placeholder="admin@skillforge.com"
                type="email"
              />
            </div>
          </div>
          <!-- Password Field -->
          <div class="stack-xs">
            <div class="flex justify-between items-center px-1">
              <label
                class="text-sm font-bold text-on-surface-variant uppercase tracking-wider"
                for="password"
                >Security Key</label
              >
              <a
                class="text-xs font-bold text-primary hover:text-primary-dim transition-colors"
                href="#"
                >Forgot Password?</a
              >
            </div>
            <div class="relative group">
              <div
                class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"
              >
                <span
                  class="material-symbols-outlined icon text-outline group-focus-within:text-primary transition-colors"
                  >lock</span
                >
              </div>
              <input
                class="w-full bg-surface-container-low border-transparent focus:border-primary focus:ring-0 rounded-xl py-4 pl-12 pr-12 text-on-surface font-medium transition-all duration-200 placeholder:text-outline/50 border-2"
                id="password"
                placeholder="••••••••••••"
                type="password"
              />
              <button
                class="absolute inset-y-0 right-0 pr-4 flex items-center text-outline hover:text-on-surface transition-colors"
                type="button"
              >
                <span class="material-symbols-outlined icon">visibility</span>
              </button>
            </div>
          </div>
          <!-- Security Context Check -->
          <div class="flex items-center space-x-3 py-2 px-1">
            <div class="relative flex items-center">
              <input
                class="h-5 w-5 rounded border-outline-variant text-primary focus:ring-primary/20 transition-all"
                id="remember"
                type="checkbox"
              />
            </div>
            <label
              class="text-sm font-medium text-on-surface-variant"
              for="remember"
              >Trust this device for 30 days</label
            >
          </div>
          <!-- Action Button -->
          <button class="btn btn-primary btn-lg btn-w-full" type="submit">
            <span>Sign In to SkillForge</span>
            <span
              class="material-symbols-outlined nav-icon group-hover:translate-x-1 transition-transform"
              >arrow_forward</span
            >
          </button>
        </form>
        <!-- Secondary Actions -->
        <div class="mt-8 pt-8 border-t border-outline-variant/15 text-center">
          <p class="text-sm text-on-surface-variant">
            Authorized personnel only. Your IP:
            <span class="font-mono text-on-surface">192.168.1.104</span>
          </p>
          <div class="mt-4 flex justify-center gap-6">
            <a
              class="text-xs font-bold text-on-surface-variant hover:text-primary transition-all flex items-center gap-1"
              href="#"
            >
              <span class="material-symbols-outlined icon">security</span>
              Compliance
            </a>
            <a
              class="text-xs font-bold text-on-surface-variant hover:text-primary transition-all flex items-center gap-1"
              href="#"
            >
              <span class="material-symbols-outlined icon">help_center</span>
              Support
            </a>
          </div>
        </div>
      </div>
      <!-- Footer / Editorial Detail -->
      <footer class="mt-12 text-center">
        <div class="flex justify-center items-center gap-2 mb-2">
          <div class="h-[1px] w-8 bg-outline-variant/30"></div>
          <p
            class="text-label font-extrabold uppercase tracking-[0.2em] text-outline"
          >
            SkillForge v4.2.0
          </p>
          <div class="h-[1px] w-8 bg-outline-variant/30"></div>
        </div>
        <div class="mt-6">
          <img
            alt="Abstract administrative texture"
            class="mx-auto w-16 h-1 rounded-full opacity-20"
            data-alt="Close-up of clean architectural lines and glass surfaces with soft daylight creating subtle shadows and geometric patterns"
            src="https://lh3.googleusercontent.com/aida-public/AB6AXuCpB52ULzcl3ZT_c3p19RQ2kFrms2H6v8ufKl3vOEorO3tqkq6q1SogdVnZYucyEAvfj14z1S1nnuobK2pU78xX_irxsmBZLjaXLOU-MsB9IwUdhfS1d_b6qj8ryOrxh-nakKGL7ATmIZ5LOMwg3zkOefkb8ierAVU-nYk9WA9EVc8lLwijEs_WRTU-VdZDzW8l16tuKI5CsC5RY76zCPzihmIkpE4GnCubBdS2Yu4CD3twSbePNVGjE0TBG1HO1NsSmR_g5eMuDbiQ"
          />
        </div>
      </footer>
    </main>
    <!-- Decorative Canvas Elements -->
    <div
      class="fixed top-1/4 right-0 transform translate-x-1/2 opacity-5 pointer-events-none select-none"
    >
      <span
        class="text-[12rem] font-black text-on-surface tracking-tighter leading-none"
        >SF</span
      >
    </div>
  </body>
</html>
