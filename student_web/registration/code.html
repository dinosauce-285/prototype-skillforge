<!DOCTYPE html>

<html lang="en"><head>
<link rel="stylesheet" href="../../shared/tailwind-desktop.css"/>
<link rel="stylesheet" href="../../shared/base.css"/>

<meta charset="utf-8"/>
<meta name="description" content="SkillForge — The premium platform for professional skill development and certification."/>
<link rel="icon" type="image/svg+xml" href="../../shared/favicon.svg"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SkillForge | Create Account</title>

</head>
<body class="bg-surface font-body text-on-surface selection:bg-primary-fixed">
<main class="min-h-screen flex flex-col md:flex-row">
<!-- Editorial Side: Visual/Context -->
<section class="hidden md:flex md:w-1/2 lg:w-3/5 bg-surface-container-low relative overflow-hidden items-center justify-center p-12">
<div class="absolute inset-0 z-0">
<img alt="Group of students collaborating around a laptop in a bright modern workspace" class="w-full h-full object-cover opacity-10" data-alt="Modern collaborative workspace with diverse professionals working together in a minimalist bright architectural setting with soft natural light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAfvyg6DJFpWl0q5tHLzBSlNFmYSa5kVOowa6483KBHfSlCK79NmX2vI93RvL9PRfnTk149YyeananxT3MR0BZBGSpUlY178ezXc7EKDx1gwfJaQPVqDrQgiNsS21wFqvZhoS0v19ZD1g2FTAqSX_qR09p2chP6o6xy1MvnHmeKlaRyuxjk1Usw-wHHHVXcwXF-PimN7K2uruQ-jyYIOrKylT97kiI3fxpS7HnAMjxezfvnTeeQeLppufWi7reUEBmJjQPsHx2IcdVI"/>
</div>
<div class="relative z-10 max-w-xl">
<div class="mb-8 flex items-center gap-2">
<span class="sf-brand text-3xl">SkillForge</span>
</div>
<h1 class="font-headline font-bold text-6xl lg:text-7xl text-on-surface leading-[1.1] mb-6 tracking-tight">
                    Master your <br/>
<span class="text-primary-container">intellectual</span> <br/>
                    craft.
                </h1>
<p class="text-xl text-on-surface-variant font-light leading-relaxed max-w-md">
                    Join a community of dedicated learners. Access curated content designed for deep focus and high-end professional growth.
                </p>
<div class="mt-12 flex gap-4">
<div class="h-1 w-12 bg-primary-container rounded-full"></div>
<div class="h-1 w-4 bg-outline-variant rounded-full"></div>
<div class="h-1 w-4 bg-outline-variant rounded-full"></div>
</div>
</div>
<!-- Asymmetric floating element -->
<div class="absolute -bottom-20 -right-20 w-80 h-80 bg-primary-fixed/20 rounded-full blur-3xl"></div>
</section>
<!-- Registration Form Side -->
<section class="flex-1 flex flex-col justify-center px-6 py-12 md:px-16 lg:px-24 bg-surface-bright">
<div class="container-xs">
<header class="mb-10">

<h2 class="font-headline font-bold text-3xl text-on-surface mb-2">Create your account</h2>
<p class="text-on-surface-variant">Start your journey toward mastery today.</p>
</header>
<!-- Social Authentication -->
<div class="grid grid-cols-2 gap-4 mb-8">
<button class="flex items-center justify-center gap-3 py-3 px-4 bg-surface-container-lowest hover:bg-surface-container-low rounded-xl transition-all duration-200 shadow-md active:scale-[0.98]">
<img alt="Google" class="w-5 h-5" data-alt="Google colorful logo icon on transparent background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCAyHoGAhnJITLtyaQD5EHbdZLlMsHgTXJqYM0v3ycHSZbDmJKcjMw4i6ROBuV2zm6PPf-ycZDlWeVYG9GTGWwStVgY93edQT5xhZrZ1qHTKd0BnC2_Exg4P1vls06yCA4HS-u-XyEVfcqWCq85zLc0eefo7guLQo-GapOOHasmWpK4b95Cxbga4ZFbbZ2PYS8LbA5LhU-hLZjH9aVc7wiAknoAUG8I5rAW1W3n7HFq6C_ByaS67yq--DhOR4oF8JRUxOgAK9vmg2b2"/>
<span class="font-label font-semibold text-sm">Google</span>
</button>
<button class="flex items-center justify-center gap-3 py-3 px-4 bg-surface-container-lowest hover:bg-surface-container-low rounded-xl transition-all duration-200 shadow-md active:scale-[0.98]">
<span class="material-symbols-outlined icon text-blue-600">social_leaderboard</span>
<span class="font-label font-semibold text-sm">Facebook</span>
</button>
</div>
<div class="relative flex py-4 items-center mb-8">
<div class="flex-grow border-t border-outline-variant/30"></div>
<span class="flex-shrink mx-4 text-sm font-label font-medium text-on-surface-variant uppercase tracking-widest">or email</span>
<div class="flex-grow border-t border-outline-variant/30"></div>
</div>
<!-- Main Form -->
<form class="stack">
<div class="stack-xs">
<label class="block font-label font-bold text-sm text-on-surface ml-1 tracking-wide" for="full_name">Full Name</label>
<input class="w-full bg-surface-container-low border-none rounded-xl py-4 px-5 focus:ring-2 focus:ring-primary-container transition-all placeholder:text-on-surface-variant/40" id="full_name" name="full_name" placeholder="Alex Forge" type="text"/>
</div>
<div class="stack-xs">
<label class="block font-label font-bold text-sm text-on-surface ml-1 tracking-wide" for="email">Email Address</label>
<input class="w-full bg-surface-container-low border-none rounded-xl py-4 px-5 focus:ring-2 focus:ring-primary-container transition-all placeholder:text-on-surface-variant/40" id="email" name="email" placeholder="alex@example.com" type="email"/>
</div>
<div class="stack-xs">
<div class="flex justify-between items-center px-1">
<label class="block font-label font-bold text-sm text-on-surface tracking-wide" for="password">Password</label>
</div>
<div class="relative">
<input class="w-full bg-surface-container-low border-none rounded-xl py-4 px-5 focus:ring-2 focus:ring-primary-container transition-all placeholder:text-on-surface-variant/40" id="password" name="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary-container transition-colors" type="button">
<span class="material-symbols-outlined nav-icon">visibility</span>
</button>
</div>
</div>
<div class="flex items-start gap-3 px-1">
<div class="flex items-center h-5">
<input class="h-5 w-5 rounded-md border-none bg-surface-container-high text-primary-container focus:ring-primary-container" id="terms" name="terms" type="checkbox"/>
</div>
<label class="text-sm text-on-surface-variant leading-relaxed" for="terms">
                            I agree to the <a class="text-primary font-semibold hover:underline" href="#">Terms of Service</a> and <a class="text-primary font-semibold hover:underline" href="#">Privacy Policy</a>.
                        </label>
</div>
<button class="btn btn-primary btn-lg btn-pill btn-w-full mt-4" type="submit">
                        Create Account
                    </button>
</form>
<footer class="mt-10 text-center">
<p class="text-on-surface-variant">
                        Already have an account? 
                        <a class="text-primary font-bold ml-1 hover:underline tracking-tight" href="#">Sign In</a>
</p>
</footer>
</div>
<!-- Mobile Brand Mark -->
<div class="mt-auto pt-12 md:hidden text-center">
<span class="text-primary-container font-headline font-black text-xl italic tracking-tighter">SkillForge</span>
</div>
</section>
</main>
</body></html>
